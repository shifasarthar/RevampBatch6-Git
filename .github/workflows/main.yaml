name: Node pipeline
on: push
jobs:
  node:
    runs-on: wsl-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: npm install
      - name: Run application
        run: |
           echo "PORT=8080" > .env.development
           echo "APP=Development" >> .env.development
           node server.js &
           sleep 5
           curl --fail http://localhost:8080
      
